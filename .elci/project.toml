[project]
id = "tempcheq"
name = "tempcheq"
descriptor = "TempCheq is a Rust CLI that audits a codebase for LLM inference temperature settings. Static analysis finds every sampling temperature (set or silently defaulted), classifies the task at each call site, and flags values outside the sane range for that task, with explain, benchmark, fix-preview, watch, and JSON or HTML reports."
