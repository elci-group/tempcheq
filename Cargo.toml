[package]
name = "tempcheq"
version = "0.1.1"
edition = "2021"
description = "Inference-temperature auditor and optimiser"
default-run = "tempcheq"

[[bin]]
name = "tempcheq"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
walkdir = "2"
regex = "1"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
owo-colors = "4"
notify = "6"

[profile.release]
opt-level = 3
